# XcodeGen project definition. Regenerate the Xcode project with:
#   xcodegen generate
# The generated VeraFlow.xcodeproj is gitignored; this file is the source of truth.
name: VeraFlow

options:
  bundleIdPrefix: com.jeremyreger
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

configs:
  Debug: debug
  Alpha: debug      # Same code, display name "Riffle (alpha)" (SPEC §0)
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone; iPad runs the iPhone layout (SPEC §3)
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    VF_DISPLAY_NAME: VeraFlow
    DEVELOPMENT_TEAM: 2J4F7PS86L       # Jeremy's team; keeps signing intact when the project is regenerated
  configs:
    Alpha:
      VF_DISPLAY_NAME: "Riffle (alpha)"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG ALPHA"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Alpha   # same mark with a RIFFLE band

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: "0.15.7"

targets:
  VeraFlow:
    type: application
    platform: iOS
    entitlements:
      path: VeraFlow/VeraFlow.entitlements   # generated by XcodeGen; declares the data-protection class (security review S-6)
      properties:
        com.apple.developer.default-data-protection: NSFileProtectionCompleteUntilFirstUserAuthentication
    sources:
      - path: VeraFlow
        excludes:
          - "Resources/Info.plist"
      - path: Shared                  # types compiled into both the app and the widget extension
    dependencies:
      - package: FluidAudio
        product: FluidAudio
      - target: VeraFlowWidgets      # Live Activity UI; embedded as an app extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeremyreger.veraflow
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
    info:
      path: VeraFlow/Resources/Info.plist
      properties:
        CFBundleDisplayName: $(VF_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
          - processing
        NSSupportsLiveActivities: true
        # Continued-processing tasks (transcription keeps running after the user leaves the app).
        # Wildcard: each run registers com.jeremyreger.veraflow.processing.<uuid>.
        BGTaskSchedulerPermittedIdentifiers:
          - com.jeremyreger.veraflow.processing.*
        NSMicrophoneUsageDescription: "VeraFlow uses the microphone to record your meetings. Audio stays on this iPhone."
        NSFaceIDUsageDescription: "VeraFlow uses Face ID to unlock the app when you turn on the app lock."
        NSRemindersFullAccessUsageDescription: "VeraFlow adds the action items you choose to your Reminders lists. Nothing is read back or sent anywhere."
        ITSAppUsesNonExemptEncryption: false
        # Lets Voice Memos, Files, Mail, etc. hand audio to VeraFlow. The system copies the file into
        # Documents/Inbox and calls onOpenURL (SPEC M2; onOpenURL chosen over a Share Extension).
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.mpeg-4-audio
              - public.mp3
              - com.microsoft.waveform-audio
              - com.apple.coreaudio-format
              - public.audio
              - public.mpeg-4          # Teams / Zoom recordings: the audio track is extracted
              - com.apple.quicktime-movie

  # Widget extension that renders the recording Live Activity (Lock Screen + Dynamic Island).
  # Shares only the top-level Shared/ folder with the app; ActivityKit state is plain data.
  VeraFlowWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: VeraFlowWidgets
        excludes:
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeremyreger.veraflow.widgets
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: VeraFlowWidgets/Info.plist
      properties:
        CFBundleDisplayName: $(VF_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  VeraFlowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VeraFlowTests
    dependencies:
      - target: VeraFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeremyreger.veraflow.tests
        GENERATE_INFOPLIST_FILE: YES

  VeraFlowUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VeraFlowUITests
    dependencies:
      - target: VeraFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeremyreger.veraflow.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: VeraFlow

schemes:
  VeraFlow:
    build:
      targets:
        VeraFlow: all
        VeraFlowTests: [test]
        VeraFlowUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: VeraFlow.storekit   # local StoreKit testing (SPEC §16 M8)
    test:
      config: Debug
      storeKitConfiguration: VeraFlow.storekit
      targets:
        - VeraFlowTests
        - VeraFlowUITests
    profile:
      config: Release
    archive:
      config: Release
  VeraFlow-Alpha:
    build:
      targets:
        VeraFlow: all
    run:
      config: Alpha
    archive:
      config: Alpha
