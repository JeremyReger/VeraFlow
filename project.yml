# XcodeGen project definition. Regenerate the Xcode project with:
#   xcodegen generate
# The generated VeraFlow.xcodeproj is gitignored; this file is the source of truth.
name: VeraFlow

options:
  bundleIdPrefix: com.jeremyreger
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

configs:
  Debug: debug
  Alpha: debug      # Same code, display name "Riffle (alpha)" (SPEC §0)
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone; iPad runs the iPhone layout (SPEC §3)
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    VF_DISPLAY_NAME: VeraFlow
  configs:
    Alpha:
      VF_DISPLAY_NAME: "Riffle (alpha)"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG ALPHA"

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: "0.15.7"

targets:
  VeraFlow:
    type: application
    platform: iOS
    sources:
      - path: VeraFlow
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - package: FluidAudio
        product: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeremyreger.veraflow
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
    info:
      path: VeraFlow/Resources/Info.plist
      properties:
        CFBundleDisplayName: $(VF_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: "VeraFlow uses the microphone to record your meetings. Audio stays on this iPhone."
        ITSAppUsesNonExemptEncryption: false

  VeraFlowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VeraFlowTests
    dependencies:
      - target: VeraFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeremyreger.veraflow.tests

  VeraFlowUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VeraFlowUITests
    dependencies:
      - target: VeraFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeremyreger.veraflow.uitests
        TEST_TARGET_NAME: VeraFlow

schemes:
  VeraFlow:
    build:
      targets:
        VeraFlow: all
        VeraFlowTests: [test]
        VeraFlowUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VeraFlowTests
        - VeraFlowUITests
    profile:
      config: Release
    archive:
      config: Release
  VeraFlow-Alpha:
    build:
      targets:
        VeraFlow: all
    run:
      config: Alpha
    archive:
      config: Alpha
