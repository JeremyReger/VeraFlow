# XcodeGen project definition. Regenerate the Xcode project with:
#   xcodegen generate
# The generated VeraFlow.xcodeproj is gitignored; this file is the source of truth.
name: VeraFlow

options:
  bundleIdPrefix: com.jeremyreger
  deploymentTarget:
    iOS: "18.0"    # v1.1 plan item 16: iOS 18–25 transcribe with Parakeet; iOS 26 APIs are @available-guarded
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

configs:
  Debug: debug
  Alpha: debug      # Same code, display name "Riffle (alpha)" (SPEC §0)
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    # FoundationModels doesn't exist before iOS 26; weak-link it so the app launches on iOS 18.
    # Verify in Xcode that the autolinked framework is weak (otool -L shows "weak"); if the
    # compiler already weak-links frameworks newer than the deployment target, this is harmless.
    OTHER_LDFLAGS: "$(inherited) -weak_framework FoundationModels"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone; iPad runs the iPhone layout (SPEC §3)
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    VF_DISPLAY_NAME: VeraFlow
    DEVELOPMENT_TEAM: 2J4F7PS86L       # Jeremy's team; keeps signing intact when the project is regenerated
  configs:
    Alpha:
      VF_DISPLAY_NAME: "Riffle (alpha)"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG ALPHA"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Alpha   # same mark with a RIFFLE band

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: "0.15.7"

targets:
  VeraFlow:
    type: application
    platform: iOS
    # No entitlements file: the Data Protection capability can't be registered on a Personal
    # Team App ID, so declaring com.apple.developer.default-data-protection broke signing.
    # iOS applies CompleteUntilFirstUserAuthentication by default and DataProtection.swift sets
    # the classes explicitly; re-add the entitlement under a paid Developer Program (S-6).
    sources:
      - path: VeraFlow
        excludes:
          # XcodeGen writes each target's Info.plist and entitlements from the `info:` and
          # `entitlements:` blocks below. They sit inside this shared source folder, so every
          # target that compiles `VeraFlow/` must exclude all of them: an Info.plist copied into
          # an app bundle as a plain resource keeps its unexpanded $(PRODUCT_BUNDLE_IDENTIFIER),
          # and the simulator then tries to launch that literal string (2026-09-19).
          - "Resources/Info.plist"
          - "Resources/Info-macOS.plist"
          - "Resources/VeraFlow-macOS.entitlements"
          - "Resources/SampleRecording"
      # The bundled sample recording (v1.1 plan item 7): a folder reference copied as-is, so the
      # archive package inside it keeps its layout. See VeraFlow/Resources/SampleRecording/README.md.
      - path: VeraFlow/Resources/SampleRecording
        type: folder
      - path: Shared                  # types compiled into both the app and the widget extension
    dependencies:
      - package: FluidAudio
        product: FluidAudio
      - target: VeraFlowWidgets      # Live Activity UI; embedded as an app extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeremyreger.veraflow
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
    info:
      path: VeraFlow/Resources/Info.plist
      properties:
        CFBundleDisplayName: $(VF_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Bundled under the SIL Open Font License (VeraFlow/Resources/Fonts/OFL-*.txt). Static
        # instances built from Google's variable fonts; PostScript names match VFFontName.
        UIAppFonts:
          - Newsreader-Regular.ttf
          - Newsreader-Italic.ttf
          - Manrope-Regular.ttf
          - Manrope-Medium.ttf
          - Manrope-SemiBold.ttf
          - Manrope-Bold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
          - processing
        NSSupportsLiveActivities: true
        # Continued-processing tasks (transcription keeps running after the user leaves the app).
        # Wildcard: each run registers com.jeremyreger.veraflow.processing.<uuid>.
        BGTaskSchedulerPermittedIdentifiers:
          - com.jeremyreger.veraflow.processing.*
        NSMicrophoneUsageDescription: "VeraFlow uses the microphone to record your meetings. Audio stays on this iPhone."
        NSFaceIDUsageDescription: "VeraFlow uses Face ID to unlock the app when you turn on the app lock."
        NSRemindersFullAccessUsageDescription: "VeraFlow adds the action items you choose to your Reminders lists. Nothing is read back or sent anywhere."
        ITSAppUsesNonExemptEncryption: false
        # Lets Voice Memos, Files, Mail, etc. hand audio to VeraFlow. The system copies the file into
        # Documents/Inbox and calls onOpenURL (SPEC M2; onOpenURL chosen over a Share Extension).
        LSSupportsOpeningDocumentsInPlace: false
        # The library archive package (v1.1 plan item 5): a folder Files shows as one item.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.jeremyreger.veraflow.archive
            UTTypeDescription: VeraFlow Archive
            UTTypeConformsTo:
              - com.apple.package
            UTTypeTagSpecification:
              public.filename-extension:
                - veraflowarchive
        CFBundleDocumentTypes:
          - CFBundleTypeName: VeraFlow Archive
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.jeremyreger.veraflow.archive
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.mpeg-4-audio
              - public.mp3
              - com.microsoft.waveform-audio
              - com.apple.coreaudio-format
              - public.audio
              - public.mpeg-4          # Teams / Zoom recordings: the audio track is extracted
              - com.apple.quicktime-movie

  # Widget extension that renders the recording Live Activity (Lock Screen + Dynamic Island).
  # Shares only the top-level Shared/ folder with the app; ActivityKit state is plain data.
  VeraFlowWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: VeraFlowWidgets
        excludes:
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeremyreger.veraflow.widgets
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: VeraFlowWidgets/Info.plist
      properties:
        CFBundleDisplayName: $(VF_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Native Mac app (v1.1 plan item 15). The same sources, bundle identifier and product name
  # as the iPhone app so one App Store record covers both (universal purchase); no widget
  # extension; its own Info.plist and sandbox entitlements. macOS 26 minimum: SpeechAnalyzer
  # and the on-device Foundation Models arrive there. Platform splits are `#if os(...)` inside
  # the shared files (RecorderPlatform, the export presentation, the tokens), never a second
  # copy of a screen.
  VeraFlow-macOS:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: VeraFlow
        excludes:
          # The same exclusions as the iPhone target, for the same reason (see above).
          - "Resources/Info.plist"
          - "Resources/Info-macOS.plist"
          - "Resources/VeraFlow-macOS.entitlements"
          - "Resources/SampleRecording"
      - path: VeraFlow/Resources/SampleRecording
        type: folder
      - path: Shared                  # RecordingControlHub and the activity state (ActivityKit parts are #if'd out)
    dependencies:
      - package: FluidAudio
        product: FluidAudio
    settings:
      base:
        PRODUCT_NAME: VeraFlow
        PRODUCT_MODULE_NAME: VeraFlow
        PRODUCT_BUNDLE_IDENTIFIER: com.jeremyreger.veraflow
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        COMBINE_HIDPI_IMAGES: YES
    entitlements:
      path: VeraFlow/Resources/VeraFlow-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true            # the microphone
        com.apple.security.network.client: true                # Apple's speech assets, the FluidAudio models, StoreKit (SPEC §14.1)
        com.apple.security.files.user-selected.read-write: true  # import / export through the open and save panels
        com.apple.security.personal-information.calendars: true  # Reminders through EventKit
    info:
      path: VeraFlow/Resources/Info-macOS.plist
      properties:
        CFBundleDisplayName: $(VF_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        # The bundled fonts sit at the top of Contents/Resources; AppKit registers them from here.
        ATSApplicationFontsPath: "."
        NSMicrophoneUsageDescription: "VeraFlow uses the microphone to record your meetings. Audio stays on this Mac."
        NSRemindersFullAccessUsageDescription: "VeraFlow adds the action items you choose to your Reminders lists. Nothing is read back or sent anywhere."
        ITSAppUsesNonExemptEncryption: false
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.jeremyreger.veraflow.archive
            UTTypeDescription: VeraFlow Archive
            UTTypeConformsTo:
              - com.apple.package
            UTTypeTagSpecification:
              public.filename-extension:
                - veraflowarchive
        CFBundleDocumentTypes:
          - CFBundleTypeName: VeraFlow Archive
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.jeremyreger.veraflow.archive
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.mpeg-4-audio
              - public.mp3
              - com.microsoft.waveform-audio
              - com.apple.coreaudio-format
              - public.audio
              - public.mpeg-4
              - com.apple.quicktime-movie

  VeraFlowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VeraFlowTests
    dependencies:
      - target: VeraFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeremyreger.veraflow.tests
        GENERATE_INFOPLIST_FILE: YES

  # The same unit tests against the Mac build (`scripts/test.sh --platform macos`).
  VeraFlowTests-macOS:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: VeraFlowTests
    dependencies:
      - target: VeraFlow-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeremyreger.veraflow.tests
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES
        # The Mac target is named VeraFlow-macOS but builds VeraFlow.app (one product name for
        # both platforms, so one App Store record with universal purchase). XcodeGen derives
        # TEST_HOST from the target name, which then points at a VeraFlow-macOS.app that is never
        # built, so both are spelled out here (2026-09-19).
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VeraFlow.app/Contents/MacOS/VeraFlow"
        BUNDLE_LOADER: "$(TEST_HOST)"

  VeraFlowUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VeraFlowUITests
    dependencies:
      - target: VeraFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeremyreger.veraflow.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: VeraFlow

schemes:
  VeraFlow:
    build:
      targets:
        VeraFlow: all
        VeraFlowTests: [test]
        VeraFlowUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: VeraFlow.storekit   # local StoreKit testing (SPEC §16 M8)
    test:
      config: Debug
      storeKitConfiguration: VeraFlow.storekit
      targets:
        - VeraFlowTests
        - VeraFlowUITests
    profile:
      config: Release
    archive:
      config: Release
  VeraFlow-Alpha:
    build:
      targets:
        VeraFlow: all
    run:
      config: Alpha
    archive:
      config: Alpha
  VeraFlow-macOS:
    build:
      targets:
        VeraFlow-macOS: all
        VeraFlowTests-macOS: [test]
    run:
      config: Debug
      storeKitConfiguration: VeraFlow.storekit
    test:
      config: Debug
      storeKitConfiguration: VeraFlow.storekit
      targets:
        - VeraFlowTests-macOS
    profile:
      config: Release
    archive:
      config: Release
